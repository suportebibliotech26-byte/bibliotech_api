# ═══════════════════════════════════════════════════
# Configuração para testes com H2 em memória
# ═══════════════════════════════════════════════════
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# JWT (valores fictícios apenas para os testes)
jwt.secret=chave-secreta-de-teste-com-pelo-menos-32-caracteres-obrigatorios
jwt.expiration=86400000

# Resend (valores fictícios para testes)
resend.api.key=test-api-key
resend.from.email=BiblioTech <test@resend.dev>
