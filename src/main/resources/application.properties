# Configuracao do Servidor
server.port=${PORT:8080}

# Configuracao do Banco de Dados (MySQL)
# Para o Railway, usaremos variaveis de ambiente que podem ser configuradas no painel
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql.railway.internal:3306/railway}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD}
#spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca_db
#spring.datasource.username=root
#spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Configuracoes de Email (Resend HTTP API)
resend.api.key=${RESEND_API_KEY:}
resend.from.email=BiblioTech <onboarding@resend.dev>

# JWT
jwt.secret=${JWT_SECRET:bibliotech-chave-secreta-super-segura-256-bits-hmac-sha256-2026}
jwt.expiration=86400000